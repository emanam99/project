# trileadclass.my.id (+ www) -> Docker container tri-leadclass (127.0.0.1:4325)
# File ini versi BOOTSTRAP (HTTP-only) untuk instalasi awal sebelum sertifikat ada.
# Aktivasi TLS (setelah DNS A record apex + CNAME www mengarah ke VPS ini):
#   certbot --nginx -d trileadclass.my.id -d www.trileadclass.my.id
# Certbot akan menambahkan blok server 443 (SSL) + redirect 80->443 secara otomatis.

server {
    listen 80;
    listen [::]:80;
    server_name trileadclass.my.id www.trileadclass.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4325;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
