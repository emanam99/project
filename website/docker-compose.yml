# Satu folder per deploy: /var/www/website (prod) atau /var/www/website2 (staging).
# Build membutuhkan PUBLIC_* (lihat Dockerfile). Set di .env VPS lalu: docker compose build && docker compose up -d
#
# Deploy dari Windows: .\deploy-website-vps.ps1 (dari folder htdocs)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://127.0.0.1:4321}
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://127.0.0.1}
    image: ${WEBSITE_IMAGE_NAME:-pesantren-web:local}
    container_name: ${WEBSITE_CONTAINER_NAME:-pesantren-web}
    restart: always
    ports:
      - "${WEBSITE_HOST_PORT:-4321}:4321"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
