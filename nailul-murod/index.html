    <!-- Pemulihan otomatis: meta nm-build-id disuntik Vite tiap build; beda dengan localStorage → bersihkan SW + Cache Storage -->
    <script>
      ;(function () {
        try {
          var m = document.querySelector('meta[name="nm-build-id"]')
          var buildId = m && m.getAttribute('content')
          if (!buildId) return
          var key = 'nm-last-build-id'
          if (localStorage.getItem(key) === buildId) return
          var needsReload = false
          var p = Promise.resolve()
          if ('serviceWorker' in navigator) {
            p = p.then(function () {
              return navigator.serviceWorker.getRegistrations().then(function (regs) {
                if (regs.length) needsReload = true
                return Promise.all(regs.map(function (r) { return r.unregister() }))
              })
            })
          }
          if ('caches' in window) {
            p = p.then(function () {
              return caches.keys().then(function (keys) {
                if (keys.length) needsReload = true
                return Promise.all(keys.map(function (k) { return caches.delete(k) }))
              })
            })
          }
          p.then(function () {
            try {
              localStorage.removeItem('nm-app-shell-gen')
            } catch (e) {}
            localStorage.setItem(key, buildId)
            if (needsReload) window.location.reload()
          }).catch(function () {
            try {
              localStorage.setItem(key, buildId)
            } catch (e) {}
          })
        } catch (e) {}
      })()
    </script>
