# Deploy Kasly production ke Hostinger (kasly.syamira.my.id).
# Sama dengan kasly/deploy.ps1 terbaru — workflow ini hanya membungkus skrip itu.
#
# Jalankan: Actions → Deploy Kasly Hostinger → Run workflow
#
# Secret wajib:
#   DEPLOY_SSH_KEY atau DEPLOY_SSH_KEY_B64 — private key login SSH Hostinger
# Opsional (host default sama deploy.ps1):
#   DEPLOY_SSH_USER / DEPLOY_SSH_HOST / DEPLOY_SSH_PORT
# Untuk seed/timpa .env production (hanya jika file belum ada, atau Force env):
#   KASLY_DB_PASS, KASLY_GOOGLE_CLIENT_ID, KASLY_GOOGLE_CLIENT_SECRET
#   (fallback: DB_PASS, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET)

name: Deploy Kasly Hostinger

concurrency:
  group: deploy-kasly-hostinger
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope (sama deploy.ps1: 1 frontend, 2 API, 3 frontend+API, 4 gambar, 5 semua)"
        required: true
        type: choice
        options:
          - all
          - frontend
          - api
          - both
          - gambar
        default: all
      migrate:
        description: Jalankan php migrate.php di server setelah upload API
        required: false
        type: boolean
        default: false
      force_env:
        description: Timpa .env production (jangan dicentang kecuali ingin ganti secret)
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.scope == 'frontend' || inputs.scope == 'both' || inputs.scope == 'all'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kasly/app/package-lock.json

      - name: Setup PHP + Composer
        if: inputs.scope == 'api' || inputs.scope == 'both' || inputs.scope == 'all'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Configure SSH for Hostinger
        shell: pwsh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          $user = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SSH_USER)) { 'u264984103' } else { $env:DEPLOY_SSH_USER.Trim() }
          $hostName = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SSH_HOST)) { '145.223.108.9' } else { $env:DEPLOY_SSH_HOST.Trim() }
          $port = if ([string]::IsNullOrWhiteSpace($env:DEPLOY_SSH_PORT)) { '65002' } else { $env:DEPLOY_SSH_PORT.Trim() }
          if ($port -notmatch '^\d+$') { throw "DEPLOY_SSH_PORT tidak valid: [$port]" }

          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir 'id_ed25519'

          if (-not [string]::IsNullOrWhiteSpace($env:DEPLOY_SSH_KEY_B64)) {
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:DEPLOY_SSH_KEY_B64.Trim()))
          } elseif (-not [string]::IsNullOrWhiteSpace($env:DEPLOY_SSH_KEY)) {
            $key = ($env:DEPLOY_SSH_KEY -replace "`r`n", "`n" -replace "`r", "`n").TrimEnd() + "`n"
            [System.IO.File]::WriteAllText($keyPath, $key)
          } else {
            throw "Secret DEPLOY_SSH_KEY_B64 atau DEPLOY_SSH_KEY wajib di-set."
          }

          chmod 600 $keyPath
          ssh-keygen -lf $keyPath

          $known = Join-Path $sshDir 'known_hosts'
          '' | Set-Content -Path $known -Encoding ascii

          $configLines = @(
            'Host *',
            "  IdentityFile $keyPath",
            '  IdentitiesOnly yes',
            '  StrictHostKeyChecking accept-new',
            "  UserKnownHostsFile $known",
            '  ServerAliveInterval 30',
            '  ServerAliveCountMax 10',
            '  TCPKeepAlive yes'
          )
          [System.IO.File]::WriteAllText((Join-Path $sshDir 'config'), ($configLines -join "`n") + "`n")

          "DEPLOY_SSH_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEPLOY_SSH_HOST=$hostName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEPLOY_SSH_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "SSH target ${user}@${hostName}:${port}"
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            Write-Host "SSH attempt $i/5..."
            ssh -i $keyPath -p $port -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$known -o ConnectTimeout=40 "${user}@${hostName}" "echo SSH_OK"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Start-Sleep -Seconds (5 * $i)
          }
          if (-not $ok) {
            throw "SSH ke Hostinger gagal setelah retry. Hostinger mungkin memblokir IP runner GitHub — pakai self-hosted runner atau deploy lokal via kasly/deploy.ps1."
          }

      - name: Run kasly/deploy.ps1
        shell: pwsh
        env:
          DEPLOY_SSH_USER: ${{ env.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ env.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ env.DEPLOY_SSH_PORT }}
          DEPLOY_FORCE_ENV: ${{ inputs.force_env }}
          DB_PASS: ${{ secrets.KASLY_DB_PASS || secrets.DB_PASS }}
          GOOGLE_CLIENT_ID: ${{ secrets.KASLY_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.KASLY_GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          Set-Location kasly
          $params = @{ Scope = '${{ inputs.scope }}' }
          if ('${{ inputs.migrate }}' -eq 'true') { $params.Migrate = $true }
          if ('${{ inputs.force_env }}' -eq 'true') { $params.ForceEnv = $true }
          Write-Host ("Menjalankan: .\deploy.ps1 " + (($params.GetEnumerator() | ForEach-Object { "-$($_.Key) $($_.Value)" }) -join ' '))
          & .\deploy.ps1 @params
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
