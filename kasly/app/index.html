<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kasly — catatan belanja rumah" />
    <meta name="theme-color" content="#0e4d44" />
    <meta name="application-name" content="Kasly" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kasly" />
    <meta name="kasly-version" content="__APP_VERSION__" />
    <title>Kasly</title>
    <script>
      try {
        var root = document.documentElement
        if (localStorage.getItem('kasly_theme') === 'dark') {
          root.classList.add('dark')
        }
        var fontMap = { xs: '12px', sm: '13px', md: '14px', lg: '16px', xl: '18px' }
        var font = localStorage.getItem('kasly_font_size')
        var size = fontMap[font] || '14px'
        root.style.setProperty('--app-font-size', size)
        if (fontMap[font]) root.dataset.fontSize = font
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/gambar/icon/sppg.v232.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/gambar/icon/sppg.v2192.png" />
    <link rel="apple-touch-icon" href="/gambar/icon/sppg.v2192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
