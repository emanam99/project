runtime: php82
service: kasly-api
entrypoint: serve public/index.php

# Deploy: dari folder kasly/api
#   gcloud app deploy app.yaml
#
# Isi env di Google Cloud Console → App Engine → Settings → Environment variables
# atau lewat --set-env-vars. Jangan commit secret.

env_variables:
  DB_HOST: "127.0.0.1"
  DB_NAME: "kasly"
  DB_USER: "kasly"
  DB_PASS: ""
  # Cloud SQL: uncomment & sesuaikan
  # DB_SOCKET: "/cloudsql/PROJECT_ID:REGION:INSTANCE"
  FRONTEND_URL: "https://YOUR-FRONTEND-URL"
  GOOGLE_REDIRECT_URI: "https://YOUR-PROJECT.appspot.com/auth/google/callback"
  SUPER_ADMIN_EMAIL: "em.anam999@gmail.com"
  CORS_ORIGINS: "https://YOUR-FRONTEND-URL"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

handlers:
  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 2
