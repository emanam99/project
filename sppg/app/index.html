<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SPPG — catatan belanja dapur santri" />
    <meta name="theme-color" content="#2a96e0" />
    <meta name="application-name" content="SPPG" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SPPG" />
    <meta name="sppg-version" content="__APP_VERSION__" />
    <title>SPPG</title>
    <script>
      try {
        var root = document.documentElement
        if (localStorage.getItem('sppg_theme') === 'dark') {
          root.classList.add('dark')
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.setAttribute('content', '#0b1520')
        }
        var fontMap = { xs: '12px', sm: '13px', md: '14px', lg: '16px', xl: '18px' }
        var font = localStorage.getItem('sppg_font_size')
        var size = fontMap[font] || '14px'
        root.style.setProperty('--app-font-size', size)
        if (fontMap[font]) root.dataset.fontSize = font
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/gambar/icon/sppg.v3.u32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/gambar/icon/sppg.v3.u192.png" />
    <link rel="apple-touch-icon" href="/gambar/icon/sppg.v3.u192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
